[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-hoster"
version = "0.1.0"
description = "Collect news from RSS feeds, restructure it, and publish it as a static website."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "jinja2>=3.1",
    "anthropic>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
news-hoster = "news_hoster.cli:main"

[tool.setuptools.packages.find]
include = ["news_hoster*"]

[tool.setuptools.package-data]
news_hoster = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
