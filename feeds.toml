# Site-wide settings
[site]
title = "News Hoster"
description = "Top stories from around the web, restructured and summarised."
base_url = "https://example.com"     # used for canonical links and our own RSS feed
output_dir = "public"
db_path = "data/news.db"
max_articles = 300                   # how many recent articles to publish

# How incoming stories are rewritten.
#   engine = "auto"       -> Claude if ANTHROPIC_API_KEY is set, otherwise extractive
#   engine = "claude"     -> always use Claude
#   engine = "extractive" -> no LLM, rule-based clean-up only
[restructure]
engine = "auto"
model = "claude-opus-5-5"
categories = ["World", "Technology", "Business", "Science", "Sports", "Entertainment", "Other"]

# Add as many feeds as you like. `category` is a hint; Claude may re-classify.
[[feeds]]
name = "BBC News"
url = "https://feeds.bbci.co.uk/news/world/rss.xml"
category = "World"

[[feeds]]
name = "Ars Technica"
url = "https://feeds.arstechnica.com/arstechnica/index"
category = "Technology"

[[feeds]]
name = "NASA"
url = "https://www.nasa.gov/news-release/feed/"
category = "Science"
