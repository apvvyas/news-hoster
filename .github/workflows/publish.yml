# Fetch feeds, restructure new stories and publish the site to GitHub Pages every hour.
#
# One-time setup:
#   * Settings -> Pages -> Source: "GitHub Actions"
#   * Settings -> Secrets -> Actions: add ANTHROPIC_API_KEY (optional; without it the
#     extractive engine is used)
#   * Set [site].base_url in feeds.toml to your Pages URL
name: Publish site

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .

      # The SQLite database is the pipeline's memory (what was already fetched and
      # rewritten). Restore the newest copy and save a fresh one after each run.
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: data
          key: news-db-${{ github.run_id }}
          restore-keys: news-db-

      - name: Fetch, restructure and build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: news-hoster run --limit 100

      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: news-db-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
